modLoader="javafml"
loaderVersion="[3,)"
license="${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
description = "${mod_description}"
authors = "tgstyle, MagneticPrism"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/mct-immersive-technology"
logoFile = "ITlogo.png"
credits = "tgstyle (author), Peter (new models), MagneticPrism (started the port), KHAZ (new sounds), and the Immersive Engineering Team (code dependencies)"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${version_neoforge},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[${version_mc}]"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="immersiveengineering"
type="required"
versionRange="[${version_ie},)"
ordering="NONE"
side="BOTH"

[[mixins]]
config="mixins.immersive_technology_reforged.json"
